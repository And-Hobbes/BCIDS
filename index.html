<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BrundleCorpInternalDatabase</title>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://unpkg.com/jquery.terminal@2.x.x/js/jquery.terminal.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/jquery.terminal/css/jquery.terminal.min.css"/>

<script src="content.js"></script>
<script>
	jQuery(function($) {
		const introart = String.raw`      ___           ___                       ___           ___     
     /\  \         /\  \          ___        /\  \         /\  \    
    /::\  \       /::\  \        /\  \      /::\  \       /::\  \   
   /:/\:\  \     /:/\:\  \       \:\  \    /:/\:\  \     /:/\ \  \  
  /::\~\:\__\   /:/  \:\  \      /::\__\  /:/  \:\__\   _\:\~\ \  \ 
 /:/\:\ \:|__| /:/__/ \:\__\  __/:/\/__/ /:/__/ \:|__| /\ \:\ \ \__\
 \:\~\:\/:/  / \:\  \  \/__/ /\/:/  /    \:\  \ /:/  / \:\ \:\ \/__/
  \:\ \::/  /   \:\  \       \::/__/      \:\  /:/  /   \:\ \:\__\  
   \:\/:/  /     \:\  \       \:\__\       \:\/:/  /     \:\/:/  /  
    \::/__/       \:\__\       \/__/        \::/__/       \::/  /   
     ~~            \/__/                     ~~            \/__/    `;

			$('body').terminal(async function(command) {
					const parts = command.split(' ');
					const cmd = parts[0];
					const args = parts.slice(1);
					
					if(cmd === 'exit'){
						window.close()
					}
					else if(cmd === 'reload'){
						window.location.reload();
					}
					else if(cmd === 'open'){
						if(FILES[args[0]]){
							const lines = FILES[args[0]].split('---');
							const isAAIS = args[0] === 'AAIS.txt';
							const a1 = document.getElementById('audio1');
							const a2 = document.getElementById('audio2');
							if(isAAIS){
								a1.volume = 1; a2.volume = 0;
								a1.currentTime = 0; a2.currentTime = 0;
								a1.play(); a2.play();
							}
							// a line containing only ^^^ toggles highlight mode on/off.
							// lines printed while highlight is on are colored. the ^^^ marker itself is not printed.
							let highlight = false;
							const HIGHLIGHT_COLOR = '#ff5555'; // change this to recolor highlighted lines
							for(let i = 0; i < lines.length; i++){
								const chunk = lines[i];
								for(const subLine of chunk.split('\n')){
									if(subLine.trim() === '^^^'){
										highlight = !highlight;
										continue;
									}
									outputSpeed = Math.floor(Math.random()*50)
									if (subLine.length === 0){
										this.echo('');
									}
									else if(highlight){
										await this.echo(`[[;${HIGHLIGHT_COLOR};]${subLine}]`, {typing: true, delay: outputSpeed});
									}
									else{
										await this.echo(subLine,{typing: true, delay: outputSpeed});
									}
								}
								if(isAAIS && lines.length > 1){
									// progress through the file: 0 at the first chunk, 1 at the last
									const p = i / (lines.length - 1);
									// crossfade only happens between fadeStart and fadeEnd.
									// before fadeStart: audio1 alone. after fadeEnd: audio2 alone.
									const fadeStart = 0.4;
									const fadeEnd   = 0.6;
									const fade = Math.min(1, Math.max(0, (p - fadeStart) / (fadeEnd - fadeStart)));
									// equal-power curve: keeps combined loudness roughly flat through the fade
									a1.volume = Math.cos(fade * Math.PI / 2);
									a2.volume = Math.sin(fade * Math.PI / 2);
								}
								 this.pause();
								 await new Promise(resolve => $(document).one('keydown', resolve));
								 this.set_command('');
								 this.resume();
							}
							if(isAAIS){ a1.pause(); a2.pause(); }
						}
						else {
							this.error(`open error: provide valid file`);
						}
					}
					else if(cmd === 'boot'){
						this.clear();
						await this.echo('Initializing...', {typing: true, delay: 60});
						await this.echo('Accessing Bootloader...', {typing: true, delay: 40});
						await this.echo('Reserving Database connection...', {typing: true, delay: 70});
						await this.echo('READY');
						await new Promise(r => setTimeout(r, 3000));
						this.clear()
						await this.echo(introart + '\n Property of BrundleCorp Internal Database Systems Department \n [Type: commands]', {typing: true, delay: 10});
		
					}
					else if(cmd === 'commands'){
						this.echo(" ls: list available files\n exit: close tab\n reload: reload tab\n open + NAME: open file selected by NAME\n");
					}
					else if(cmd === 'ls'){
						this.echo(Object.keys(FILES).join('\n'));
					}
					else {
				this.echo("You typed: " + cmd + " which was not recognized");
					}
			}, {
				greetings: "Welcome NetRunner\n the System Requires Booting (type boot)"	});
		});
</script>
</head>
<body>
<audio id="audio1" src="audio1.mp3" loop preload="auto"></audio>
<audio id="audio2" src="audio2.mp3" loop preload="auto"></audio>
</body>
</html>
