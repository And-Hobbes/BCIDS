<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BrundleCorpInternalDatabase</title>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://unpkg.com/jquery.terminal@2.x.x/js/jquery.terminal.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/jquery.terminal/css/jquery.terminal.min.css"/>

<script src="content.js"></script>
<script>
	jQuery(function($) {
		const introart = String.raw`      ___           ___                       ___           ___     
     /\  \         /\  \          ___        /\  \         /\  \    
    /::\  \       /::\  \        /\  \      /::\  \       /::\  \   
   /:/\:\  \     /:/\:\  \       \:\  \    /:/\:\  \     /:/\ \  \  
  /::\~\:\__\   /:/  \:\  \      /::\__\  /:/  \:\__\   _\:\~\ \  \ 
 /:/\:\ \:|__| /:/__/ \:\__\  __/:/\/__/ /:/__/ \:|__| /\ \:\ \ \__\
 \:\~\:\/:/  / \:\  \  \/__/ /\/:/  /    \:\  \ /:/  / \:\ \:\ \/__/
  \:\ \::/  /   \:\  \       \::/__/      \:\  /:/  /   \:\ \:\__\  
   \:\/:/  /     \:\  \       \:\__\       \:\/:/  /     \:\/:/  /  
    \::/__/       \:\__\       \/__/        \::/__/       \::/  /   
     ~~            \/__/                     ~~            \/__/    `;

			$('body').terminal(async function(command) {
					const parts = command.split(' ');
					const cmd = parts[0];
					const args = parts.slice(1);
					
					if(cmd === 'exit'){
						window.close()
					}
					else if(cmd === 'reload'){
						window.location.reload();
					}
					else if(cmd === 'open'){
						if(FILES[args[0]]){
							const lines = FILES[args[0]].split('---');
							for(const chunk of lines){
								for(const subLine of chunk.split('\n')){
									if (subLine.length === 0){
										this.echo('');
									}
									else{
										outputSpeed = Math.floor(Math.random()*40)
										await this.echo(subLine,{typing: true, delay: outputSpeed});
									}
								}
								 this.pause();
								 await new Promise(resolve => $(document).one('keydown', resolve));
								 this.resume();
							}
							
						}
						else {
							this.error(`open error: provide valid file`);
						}
					}
					else if(cmd === 'boot'){
						this.clear();
						await this.echo('Initializing...', {typing: true, delay: 60});
						await this.echo('Accessing Bootloader...', {typing: true, delay: 40});
						await this.echo('Reserving Database connection...', {typing: true, delay: 70});
						await this.echo('READY');
						await new Promise(r => setTimeout(r, 3000));
						this.clear()
						await this.echo(introart + '\n Property of BrundleCorp Internal Database Systems Department \n [Type: commands]', {typing: true, delay: 10});
		
					}
					else if(cmd === 'commands'){
						this.echo(" ls: list available files\n exit: close tab\n reload: reload tab\n open + NAME: open file selected by NAME\n");
					}
					else if(cmd === 'ls'){
						this.echo(Object.keys(FILES).join('\n'));
					}
					else {
				this.echo("You typed: " + cmd + " which was not recognized");
					}
			}, {
				greetings: "Welcome NetRunner\n the System Requires Booting (type boot)"	});
		});
</script>
</head>
<body>
</body>
</html>
