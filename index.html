<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BrundleCorpInternalDatabase</title>
<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="https://unpkg.com/jquery.terminal@2.x.x/js/jquery.terminal.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/jquery.terminal/css/jquery.terminal.min.css"/>

<script src="content.js"></script>
<script>
	jQuery(function($) {
		const introart = String.raw`      ___           ___                       ___           ___     
     /\  \         /\  \          ___        /\  \         /\  \    
    /::\  \       /::\  \        /\  \      /::\  \       /::\  \   
   /:/\:\  \     /:/\:\  \       \:\  \    /:/\:\  \     /:/\ \  \  
  /::\~\:\__\   /:/  \:\  \      /::\__\  /:/  \:\__\   _\:\~\ \  \ 
 /:/\:\ \:|__| /:/__/ \:\__\  __/:/\/__/ /:/__/ \:|__| /\ \:\ \ \__\
 \:\~\:\/:/  / \:\  \  \/__/ /\/:/  /    \:\  \ /:/  / \:\ \:\ \/__/
  \:\ \::/  /   \:\  \       \::/__/      \:\  /:/  /   \:\ \:\__\  
   \:\/:/  /     \:\  \       \:\__\       \:\/:/  /     \:\/:/  /  
    \::/__/       \:\__\       \/__/        \::/__/       \::/  /   
     ~~            \/__/                     ~~            \/__/    `;

			$('body').terminal(async function(command) {
					const parts = command.split(' ');
					const cmd = parts[0];
					const args = parts.slice(1);
					
					if(cmd === 'exit'){
						window.close()
					}
					else if(cmd === 'reload'){
						window.location.reload();
					}
					else if(cmd === 'open'){
						const isWEOROLD = args[0] === 'WEOROLD.txt';
						const WEOROLD_INTERVAL = 3500; 

						if(!isWEOROLD){
							this.echo('[press any key after sentence is written to continue]');
							this.pause();
							await new Promise(resolve => $(document).one('keydown', resolve));
							this.set_command('');
							this.resume();
						}

						if(FILES[args[0]]){
							const lines = FILES[args[0]].split('---');
							const isAAIS = args[0] === 'AAIS.txt';
							const isCVTS = args[0] === 'CVTS.txt';
							const a1 = document.getElementById('audio1');
							const a2 = document.getElementById('audio2');
							if(isAAIS){
								a1.volume = 1; a2.volume = 0;
								a1.currentTime = 0; a2.currentTime = 0;
								a1.play(); a2.play();
							}
							let highlight = false;
							const HIGHLIGHT_COLOR = '#ff5555'; // change to recolor
							const wrap = (s, hi) => hi ? `[[;${HIGHLIGHT_COLOR};]${s}]` : s;
							const waitForKey = async () => {
								this.pause();
								await new Promise(r => $(document).one('keydown', r));
								this.set_command('');
								this.resume();
							};
							for(let i = 0; i < lines.length; i++){
								const chunk = lines[i];

								if(isCVTS){
									const items = [];
									let inVariants = false;
									for(const s of chunk.split('\n')){
										if(s.trim() === '~~~'){ inVariants = true; continue; }
										if(s.trim() === '^^^'){ highlight = !highlight; continue; }
										if(s.trim().length === 0) continue;
										items.push({text: s, hi: highlight, variant: inVariants});
									}
									if(!items.some(it => it.variant)){
										for(const it of items) it.variant = true;
									}
									for(let j = 0; j < items.length; j++){
										const {text, hi, variant} = items[j];
										const speed = Math.floor(Math.random()*30);
										await this.echo(wrap(text, hi), {typing: true, delay: speed});
										await waitForKey();
										const next = items[j + 1];
										if(variant && next && next.variant){
											const idx = this.last_index();
											for(let k = text.length - 1; k >= 0; k--){
												this.update(idx, wrap(text.substring(0, k), hi));
												await new Promise(r => setTimeout(r, speed));
											}
											this.remove_line(idx);
										}
									}
									continue; 
								}

								for(const subLine of chunk.split('\n')){
									if(subLine.trim() === '^^^'){
										highlight = !highlight;
										continue;
									}
									outputSpeed = Math.floor(Math.random()*30); 
									if (subLine.length === 0){
										this.echo('');
									}
									else {
										await this.echo(wrap(subLine, highlight), {typing: true, delay: outputSpeed});
									}
								}
								if(isAAIS && lines.length > 1){
									const p = i / (lines.length - 1);
									const fadeStart = 0.4;
									const fadeEnd   = 0.6;
									const fade = Math.min(1, Math.max(0, (p - fadeStart) / (fadeEnd - fadeStart)));
									a1.volume = Math.cos(fade * Math.PI / 2);
									a2.volume = Math.sin(fade * Math.PI / 2);
								}
								if(isWEOROLD){
									await new Promise(r => setTimeout(r, WEOROLD_INTERVAL));
								} else {
									await waitForKey();
								}
							}
							if(isAAIS){ a1.pause(); a2.pause(); }
						}
						else {
							this.error(`open error: provide valid file`);
						}
					}
					else if(cmd === 'boot'){
						this.clear();
						await this.echo('Initializing...', {typing: true, delay: 60});
						await this.echo('Accessing Bootloader...', {typing: true, delay: 40});
						await this.echo('Reserving Database connection...', {typing: true, delay: 70});
						await this.echo('READY');
						await new Promise(r => setTimeout(r, 2000));
						this.clear()
						await this.echo(introart + '\n Property of BrundleCorp Internal Database Systems Department \n [Type: commands]', {typing: true, delay: 5});
		
					}
					else if(cmd === 'commands'){
						this.echo(" [[b;yellow;]ls]: list files that can be opened with open command\n [[b;yellow;]open + NAME]: open file selected by NAME [example: open AAIS.txt]\n"); // exit: close tab\n reload: reload tab\n 
					}
					else if(cmd === 'ls'){
						this.echo(Object.keys(FILES).map(f=>`[[;green;]${f}]`).join('\n'));
					}
					else {
				this.echo("You typed: " + cmd + " which was not recognized");
					}
			}, {
				greetings: "Welcome NetRunner\n the System Requires Booting (type boot)"	});
		});
</script>
</head>
<body>
<audio id="audio1" src="audio1.mp3" loop preload="auto"></audio>
<audio id="audio2" src="audio2.mp3" loop preload="auto"></audio>
</body>
</html>
